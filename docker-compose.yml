services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: myrouter
      POSTGRES_PASSWORD: myrouter
      POSTGRES_DB: myrouter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myrouter -d myrouter"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
